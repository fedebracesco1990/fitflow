services:
  mysql:
    image: mysql:8.0
    container_name: fitflow-mysql
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # Read from the root .env (see .env.example)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      # $$ escapes compose interpolation: the variable is expanded inside the container
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Development mail catcher: SMTP on 1025, web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: fitflow-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local
    name: fitflow_mysql_data

networks:
  app-network:
    driver: bridge
    name: fitflow_network
